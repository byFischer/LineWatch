report.m1=DSL values (SNR margin, sync rate, CRC counters) are read from the modem's management interface about every %d seconds.
report.m2=Internet access is checked about every %d seconds by timing TCP connections to Cloudflare (1.1.1.1), Google (8.8.8.8) and Quad9 (9.9.9.9).
report.m3=Data coverage — DSL: %s, internet: %s. Coverage is the number of measurements taken divided by the number expected; time when the computer was off lowers it.
report.m4=Each point on the charts is the average of a short time interval; intervals without measurements are left blank.
report.m5=The CRC counter resets when the modem restarts; those steps are not counted, so the CRC total may be lower than the real value but never higher.
report.m6=While the line is down the internet is unreachable too; that time is listed as a line drop and not counted again as an internet outage. Internet availability can therefore be lower than the listed internet outages alone suggest.
report.m7=Detailed measurements from before %s are no longer stored, so hourly summaries were used for that part; there, chart points and outage times are accurate to the hour.
